<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background warm cream gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdf9ee"/>
      <stop offset="100%" stop-color="#f6efe0"/>
    </linearGradient>
  </defs>

  <!-- App icon squircle background -->
  <rect width="512" height="512" rx="112" fill="url(#cardBg)"/>

  <!-- Milk carton line illustration -->
  <g 
    fill="none" 
    stroke="#ea6a38" 
    stroke-width="11" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  >
    <!-- Top ridge tab (gable peak) -->
    <rect x="200" y="135" width="112" height="26" rx="8" />

    <!-- Slanted roof edges -->
    <!-- Left shoulder slope -->
    <path d="M 204 161 L 171 220" />
    <!-- Ridge center fold to center shoulder -->
    <path d="M 306 161 L 273 220" />
    <!-- Right gable slope -->
    <path d="M 306 161 L 341 220" />

    <!-- Right gable internal diagonal fold -->
    <path d="M 290 196 L 324 213" />

    <!-- Shoulder horizontal crease line -->
    <path d="M 171 220 L 341 220" />

    <!-- Front & side vertical corner edges -->
    <!-- Left vertical edge -->
    <path d="M 171 220 L 171 356" />
    <!-- Center vertical edge -->
    <path d="M 273 220 L 273 376" />
    <!-- Right vertical edge -->
    <path d="M 341 220 L 341 356" />

    <!-- Bottom edges with perspective and rounded corners -->
    <path d="M 171 356 C 171 364 176 367 182 368 L 268 376 C 271 377 275 377 278 376 L 330 368 C 336 367 341 364 341 356" />

    <!-- Spout / 3D screw cap on front roof slope -->
    <g transform="translate(232, 188) rotate(-32)">
      <!-- Top rim ellipse of cap -->
      <ellipse cx="0" cy="-2" rx="19" ry="13" />
      <!-- Cylindrical side depth of cap -->
      <path d="M -18 0 L -18 7 C -18 14 18 14 18 7 L 18 0" />
    </g>
  </g>
</svg>
